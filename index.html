<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Copilot (WebLLM + Lambda)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
        <span>📈</span> Stock Fundamentals AI Copilot
      </h1>
      <!-- API Base URL Config -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <label for="apiUrl" class="text-xs text-gray-400 whitespace-nowrap">Lambda URL:</label>
        <input id="apiUrl" type="url" value="https://knlcqtlujajjlmwocwuga5pub40kuyjn.lambda-url.ap-south-1.on.aws/" class="bg-gray-900 border border-gray-700 text-sm rounded px-3 py-1.5 w-full md:w-80 focus:outline-none focus:border-emerald-500 text-gray-200">
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto w-full flex-1 p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    
    <!-- Left Column: Controls & Fetched Stock Data (4 cols) -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <!-- Fetch Card -->
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3">1. Fetch Company Data</h2>
        <div class="flex gap-2">
          <input id="symbol" type="text" placeholder="e.g. ADANIPOWER, TCS" class="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm w-full uppercase focus:outline-none focus:border-emerald-500">
          <button id="fetchBtn" onclick="fetchStockData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded text-sm transition">
            Fetch
          </button>
        </div>
        <p id="fetchStatus" class="text-xs text-gray-400 mt-2 h-4"></p>
      </div>

      <!-- Raw Context Preview -->
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md flex-1 flex flex-col">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-2">Active Stock Context</h2>
        <textarea id="dataContext" readonly placeholder="Data fetched from Lambda will appear here and be fed to the local LLM..." class="w-full flex-1 bg-gray-900 border border-gray-700 rounded p-3 text-xs font-mono text-gray-300 resize-none focus:outline-none"></textarea>
      </div>
    </section>

    <!-- Right Column: AI Model Init & Chat Interface (8 cols) -->
    <section class="lg:col-span-8 flex flex-col bg-gray-800 rounded-xl border border-gray-700 shadow-md overflow-hidden">
      
      <!-- LLM Loader Bar -->
      <div class="bg-gray-800/80 p-4 border-b border-gray-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="text-sm font-semibold text-gray-200">2. Local WebLLM Engine</h2>
          <p id="engineStatus" class="text-xs text-amber-400">Model not initialized (WebGPU required)</p>
        </div>
        <button id="initLlmBtn" onclick="initLLM()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-medium transition">
          Load LLM Engine
        </button>
      </div>

      <!-- Chat Log -->
      <div id="chatLog" class="flex-1 p-4 overflow-y-auto space-y-4 min-h-[350px] max-h-[500px]">
        <div class="bg-gray-900/60 border border-gray-700/50 p-3 rounded-lg text-xs text-gray-400">
          👉 Enter your Lambda Function URL, fetch a stock symbol, click <b>Load LLM Engine</b>, and start asking financial analysis questions!
        </div>
      </div>

      <!-- Chat Input Area -->
      <div class="p-3 bg-gray-900 border-t border-gray-700 flex gap-2">
        <input id="userInput" type="text" placeholder="e.g. Is this company financially healthy? Check debt and cash flows." disabled onkeydown="if(event.key === 'Enter') sendMessage()" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-emerald-500 disabled:opacity-50">
        <button id="sendBtn" onclick="sendMessage()" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm font-medium transition disabled:opacity-50">
          Send
        </button>
      </div>

    </section>

  </main>

  <!-- WebLLM CDN Import -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let currentStockData = null;
    let currentSymbol = "";

    // Helper functions
function trimStockData(data) {
  if (!data) return {};
  const cleaned = JSON.parse(JSON.stringify(data));
  if (cleaned.company) {
    delete cleaned.company.raw_html;
  }
  
  let jsonString = JSON.stringify(cleaned);
  // Cap string payload if too long
  if (jsonString.length > 8000) {
    return jsonString.slice(0, 8000) + "\n...[truncated to fit model context]";
  }
  return jsonString;
}
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function appendChatMessage(role, text) {
      const chatLog = document.getElementById('chatLog');
      const wrapper = document.createElement('div');
      
      if (role === "user") {
        wrapper.className = "flex justify-end";
        wrapper.innerHTML = `<div class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm max-w-[80%]">${escapeHtml(text)}</div>`;
      } else if (role === "assistant") {
        wrapper.className = "flex justify-start";
        const bubble = document.createElement('div');
        bubble.className = "bg-gray-700 text-gray-100 px-4 py-2 rounded-xl text-sm max-w-[80%] whitespace-pre-wrap";
        bubble.innerText = text;
        wrapper.appendChild(bubble);
        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
        return bubble;
      } else {
        wrapper.className = "text-center text-xs text-gray-400 my-1";
        wrapper.innerText = text;
      }
      
      chatLog.appendChild(wrapper);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // Expose functions to window scope for HTML inline handlers
    window.fetchStockData = async function() {
      const urlInput = document.getElementById('apiUrl');
      const symbolInput = document.getElementById('symbol');
      const statusEl = document.getElementById('fetchStatus');

      let baseUrl = urlInput ? urlInput.value.trim() : '';
      const symbol = symbolInput ? symbolInput.value.trim().toUpperCase() : '';

      // Clean trailing slashes or /v1 suffix
      baseUrl = baseUrl.replace(/\/+$/, '');
      if (baseUrl.endsWith('/v1')) {
        baseUrl = baseUrl.slice(0, -3);
      }

      if (!baseUrl) {
        statusEl.innerText = "❌ Please enter your Lambda Base URL.";
        statusEl.className = "text-xs text-red-400 mt-2";
        return;
      }

      if (!symbol) {
        statusEl.innerText = "❌ Please enter a stock symbol.";
        statusEl.className = "text-xs text-red-400 mt-2";
        return;
      }

      statusEl.innerText = `Fetching data for ${symbol}...`;
      statusEl.className = "text-xs text-amber-400 mt-2";

      try {
        const response = await fetch(`${baseUrl}/v1/company/${symbol}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const companyData = await response.json();
        currentSymbol = symbol;
        currentStockData = { company: companyData };
        
        document.getElementById('dataContext').value = JSON.stringify(currentStockData, null, 2);
        statusEl.innerText = `✅ Loaded data for ${symbol}`;
        statusEl.className = "text-xs text-emerald-400 mt-2";
        
        appendChatMessage("system", `Context updated with financial data for **${symbol}**.`);
      } catch (err) {
        console.error("Fetch Error:", err);
        statusEl.innerText = `❌ CORS or Network Error: ${err.message}`;
        statusEl.className = "text-xs text-red-400 mt-2";
      }
    };

    window.initLLM = async function() {
      const statusEl = document.getElementById('engineStatus');
      const initBtn = document.getElementById('initLlmBtn');
      
      initBtn.disabled = true;
      statusEl.innerText = "Downloading model weights into browser memory...";

      try {
        const modelId = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
        engine = await webllm.CreateMLCEngine(modelId, {
          initProgressCallback: (progress) => {
            statusEl.innerText = progress.text;
          }
        });

        statusEl.innerText = "✅ LLM Engine Ready (Running on WebGPU)";
        statusEl.className = "text-xs text-emerald-400";
        initBtn.classList.add("hidden");
        document.getElementById('userInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
      } catch (err) {
        console.error(err);
        statusEl.innerText = `❌ Failed to initialize WebLLM: ${err.message}`;
        statusEl.className = "text-xs text-red-400";
        initBtn.disabled = false;
      }
    };

    window.sendMessage = async function() {
      const inputEl = document.getElementById('userInput');
      const prompt = inputEl.value.trim();

      if (!prompt || !engine) return;

      inputEl.value = "";
      appendChatMessage("user", prompt);

      const trimmedData = trimStockData(currentStockData);

      const systemPrompt = `You are a financial analyst copilot. Analyze the provided JSON financial data for ${currentSymbol || 'the company'}.

Guidelines:
- Be concise and direct. Use short bullet points.
- Focus on key financial ratios, revenue growth, debt levels, and profitability trends.
- Keep responses concise so they complete fully without getting cut off.

Financial Data:
${JSON.stringify(trimmedData)}`;

      const messages = [
        { role: "system", content: systemPrompt },
        { role: "user", content: prompt }
      ];

      const assistantBubble = appendChatMessage("assistant", "Thinking...");

      try {
        const chunks = await engine.chat.completions.create({
          messages,
          stream: true,
          max_tokens: 7500
        });

        let fullReply = "";
        for await (const chunk of chunks) {
          const text = chunk.choices[0]?.delta?.content || "";
          fullReply += text;
          assistantBubble.innerText = fullReply;
        }
      } catch (err) {
        console.error(err);
        assistantBubble.innerText = `❌ Chat Error: ${err.message}`;
      }
    };
  </script>
</body>
</html>
